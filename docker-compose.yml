services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
  web:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["8000:8000"]
    env_file: .env
    environment:
      CB_MQTT_HOST: mosquitto
    volumes: ["datos:/data"]
    depends_on: [mosquitto]
volumes:
  datos:
